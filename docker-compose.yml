services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      KNOWLEDGE_LOCAL_PATH: /data/knowledge_base.md
    volumes:
      # Trvalý disk na hoste — história chatov pre Eniq portál prežije redeploy
      - /var/lib/ceskanadrz-chatbot/data:/data
    restart: unless-stopped
